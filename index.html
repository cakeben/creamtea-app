<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cream Tea League | UK</title>
    <meta name="description" content="Find the best cream tea near any UK address, ranked by rating and review count." />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>🍓 Cream Tea League (UK)</h1>
      <p>Find top cream tea spots by score, ratings and distance.</p>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>Search by address</h2>
        <form id="search-form">
          <input id="postcode" type="text" placeholder="e.g. Bath, London, SW1A 1AA" required />
          <button type="submit">Find best nearby</button>
        </form>
        <div class="actions-row">
          <button id="reset-btn" type="button" class="secondary">Reset to UK top 20</button>
        </div>
        <p class="muted" id="status">Showing UK top 20.</p>

        <div class="filters">
          <label>
            Radius (miles)
            <input id="radius" type="range" min="5" max="100" value="35" />
            <span id="radius-val">35</span>
          </label>
          <label>
            Sort by
            <select id="sort">
              <option value="score">League score</option>
              <option value="rating">Rating</option>
              <option value="distance">Distance</option>
              <option value="reviews">Review count</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel map-panel">
        <div id="map" aria-label="Map of cream tea locations"></div>
      </section>

      <section class="panel table-panel">
        <h2>League table</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Town</th>
                <th>Rating</th>
                <th>Reviews</th>
                <th>Dist.</th>
                <th>Score</th>
                <th>Links</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <small>
        Demo league uses a seed dataset and composite score. Map by OpenStreetMap/Leaflet.
      </small>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
